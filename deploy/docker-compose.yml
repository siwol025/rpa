# 운영용: api + PostgreSQL 16 (데이터 볼륨, 재시작 정책)
# 준비: cp deploy/.env.example deploy/.env 후 값을 채운다 (.env 는 Git 에 커밋하지 않는다)
# 실행: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 배포 절차·방화벽·동작 확인: deploy/README.md
name: callcenter

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://callcenter:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}@db:5432/callcenter
      AUDIO_STORAGE_BACKEND: local
      AUDIO_STORAGE_ROOT: /data/audio
      ROBOT_API_KEYS: ${ROBOT_API_KEYS:?ROBOT_API_KEYS 가 필요합니다}
      ROBOT_ALLOWED_IPS: ${ROBOT_ALLOWED_IPS:?ROBOT_ALLOWED_IPS 가 필요합니다}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STALE_THRESHOLD_MIN: ${STALE_THRESHOLD_MIN:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      INBOX_BACKEND: ${INBOX_BACKEND:-disabled}
      # INBOX_BACKEND=drive 일 때만 쓴다. 키 파일은 deploy/secrets/drive-sa.json 에 둔다.
      DRIVE_INBOX_FOLDER_ID: ${DRIVE_INBOX_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/drive-sa.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - audio-data:/data/audio
      # 서비스 계정 키(Git·이미지에 넣지 않음). 읽기 전용으로 마운트한다.
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # GET /health: DB·저장소 실패는 503(비정상), Drive inbox만 실패하면 200 DEGRADED(정상으로 본다). HEAD는 405.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_DB: callcenter
    # 호스트에 포트를 열지 않는다. api 컨테이너만 내부 네트워크로 접속한다.
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcenter -d callcenter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
  audio-data:
