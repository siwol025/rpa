# 시연용 덮어쓰기: 웹 업로드를 Drive 대신 서버 PC의 폴더에 저장한다 (공유 드라이브를 만들 수 없을 때).
# 그 폴더를 Windows 네트워크 공유로 열면 로봇 PC의 Dispatcher가 inboxFolder로 읽는다.
# 실행: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml --env-file deploy/.env up -d
# 운영(Drive) 설정으로 돌아가려면 이 파일 없이 docker-compose.yml만으로 다시 실행한다.
# 한계: 로컬 방식은 웹 업로드 표시(Drive properties)를 남기지 않아 웹 업로드 건도 source_type=DRIVE로 등록된다.
services:
  api:
    environment:
      INBOX_BACKEND: local
      INBOX_LOCAL_PATH: /data/inbox
    volumes:
      - ${INBOX_HOST_DIR:-C:/callcenter-inbox}:/data/inbox
