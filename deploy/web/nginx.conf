server {
    listen 80;
    root /usr/share/nginx/html;

    # 업로드 크기 제한은 api 가 MAX_UPLOAD_MB 로 판단한다(413 PAYLOAD_TOO_LARGE).
    client_max_body_size 0;

    # 로봇 API 는 로봇 PC 가 api(8000)로 직접 부른다. 웹 경로로는 열지 않는다.
    location /api/robot/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 업로드는 받는 대로 넘기고, 음성 재생·엑셀은 버퍼 없이 흘려보낸다.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 빌드 산출물은 파일 이름에 해시가 붙으므로 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 화면 경로(/calls/1 등)는 index.html 로 돌려 브라우저 라우터가 처리한다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
